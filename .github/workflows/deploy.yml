name: Deploy to Ubuntu Server

on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - name: Update repository
        working-directory: /var/www/liquid-vanilla
        run: |
          git fetch origin master
          git reset --hard "$GITHUB_SHA"

      - name: Install backend dependencies
        working-directory: /var/www/liquid-vanilla/backend
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Build frontend
        working-directory: /var/www/liquid-vanilla/frontend
        run: |
          npm ci
          npm run build

      - name: Restart backend
        run: sudo /usr/bin/supervisorctl restart liquid-vanilla

      - name: Verify backend is responding
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -m 3 http://127.0.0.1:8000/ >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not come up"
          sudo /usr/bin/supervisorctl status liquid-vanilla
          tail -50 /var/log/liquid-vanilla-backend.err.log
          exit 1
